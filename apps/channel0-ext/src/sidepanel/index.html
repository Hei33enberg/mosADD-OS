<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mURL</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; color: #fff;
                   font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; }
      body { display: flex; flex-direction: column; }
      #host { flex: 1; min-height: 0; display: flex; }
      #host > * { flex: 1; min-width: 0; }
      #settings-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.85);
                          display: none; align-items: stretch; justify-content: stretch; }
      #settings-overlay.is-open { display: flex; }
      #settings-pane { flex: 1; padding: 16px; overflow-y: auto;
                       background: #0a0a0a; border-left: 2px solid #fff; }
      #settings-pane h2 { margin: 0 0 16px; font-size: 14px; font-weight: 900;
                          text-transform: uppercase; letter-spacing: 0.08em; color: #fff;
                          display: flex; align-items: center; justify-content: space-between; }
      #settings-pane h2 button { background: transparent; color: #fff;
                                 border: 2px solid rgba(255,255,255,0.3);
                                 padding: 4px 8px; cursor: pointer; font-weight: 900; }
      #settings-pane h2 button:hover { background: rgba(255,255,255,0.1); }
      .row { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; }
      .row label { font-size: 11px; font-weight: 900; color: rgba(255,255,255,0.7);
                   text-transform: uppercase; letter-spacing: 0.08em; }
      .seg { display: flex; gap: 0; border: 2px solid #fff; overflow: hidden; }
      .seg button { flex: 1; padding: 8px 12px; background: #111; color: #fff; border: none;
                    cursor: pointer; font-size: 12px; font-weight: 900;
                    text-transform: uppercase; letter-spacing: 0.06em; }
      .seg button.active { background: #00ff7a; color: #000; }
      .help { font-size: 12px; color: rgba(255,255,255,0.6); line-height: 1.4; }
      .danger { background: #111; color: #fff; border: 2px solid #fff;
                padding: 8px 12px; cursor: pointer; font-size: 12px;
                font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em;
                margin-top: 8px; }
      .danger:hover { background: #00ff7a; color: #000; border-color: #00ff7a; }
      .brand { color: #00ff7a; font-weight: 900; }
      .skin-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
      .skin-tile { display: flex; flex-direction: column; gap: 4px;
                    padding: 8px; background: #111; color: #fff;
                    border: 2px solid rgba(255,255,255,0.18); cursor: pointer;
                    font-family: inherit; text-align: left; }
      .skin-tile:hover { border-color: rgba(255,255,255,0.45); }
      .skin-tile.active { border-color: #00ff7a; }
      .skin-tile .swatch { display: flex; height: 22px; border: 1px solid rgba(255,255,255,0.18); }
      .skin-tile .swatch > span { flex: 1; display: block; }
      .skin-tile .label { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em; }
      .skin-tile .tagline { font-size: 9.5px; color: rgba(255,255,255,0.5); line-height: 1.3; }
      #trending-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.92);
                          display: none; align-items: stretch; justify-content: stretch; }
      #trending-overlay.is-open { display: flex; }
      #trending-pane { flex: 1; padding: 12px; overflow-y: auto;
                       background: #0a0a0a; border-left: 2px solid #00ff7a;
                       font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }
      #trending-pane h2 { margin: 0 0 12px; font-size: 13px; font-weight: 900;
                          text-transform: uppercase; letter-spacing: 0.08em; color: #fff;
                          display: flex; align-items: center; justify-content: space-between; }
      #trending-pane h2 button { background: transparent; color: #fff;
                                 border: 1px solid rgba(255,255,255,0.2);
                                 padding: 3px 7px; cursor: pointer; font-weight: 900; }
      #trending-pane h2 button:hover { background: rgba(255,255,255,0.1); }
      #trending-status { font-size: 10px; color: rgba(255,255,255,0.4);
                         text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
      .trending-row { display: flex; align-items: baseline; gap: 8px;
                      width: 100%; padding: 6px 8px; background: transparent;
                      border: 1px solid rgba(255,255,255,0.08); margin-bottom: 4px;
                      color: #fff; cursor: pointer; font-family: inherit;
                      text-align: left; }
      .trending-row:hover { border-color: #00ff7a; background: rgba(0,255,122,0.04); }
      .trending-domain { color: #00ff7a; font-weight: 700; flex: 1; min-width: 0;
                         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
      .trending-msgs { color: rgba(255,255,255,0.65); font-size: 10px; }
      .trending-time { color: rgba(255,255,255,0.35); font-size: 10px; }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <div id="settings-overlay">
      <div id="settings-pane">
        <h2>
          <span data-i18n="settingsTitle">Settings</span>
          <button id="settings-close" aria-label="close">x</button>
        </h2>
        <div class="row">
          <label data-i18n="settingOpenMode">Open chat in</label>
          <div class="seg" id="open-mode">
            <button data-mode="side"   data-i18n="settingOpenModeSide">Side panel</button>
            <button data-mode="inline" data-i18n="settingOpenModeInline">Floating panel</button>
          </div>
        </div>
        <div class="row">
          <label data-i18n="settingAppearance">Appearance</label>
          <div class="help" data-i18n="settingAppearanceHelp">The same skin applies to murl.mosadd.com when you visit it.</div>
          <div class="skin-grid" id="skin-grid"></div>
        </div>
        <div class="row">
          <label data-i18n="settingBubblePos">Bubble position</label>
          <div class="help" data-i18n="settingBubbleDrag">Drag the bubble to reposition.</div>
          <button class="danger" id="reset-bubble" data-i18n="settingBubbleReset">Reset bubble position</button>
        </div>
        <div class="row">
          <label>Legal &amp; safety</label>
          <div class="help">
            <a href="https://mosadd.dev/murl/abuse" target="_blank" rel="noreferrer" style="color:#00ff7a; text-decoration:underline;">Report abuse / DMCA</a><br/>
            <a href="https://mosadd.dev/murl/privacy" target="_blank" rel="noreferrer" style="color:#00ff7a; text-decoration:underline;">Privacy policy</a><br/>
            <a href="https://mosadd.dev/murl" target="_blank" rel="noreferrer" style="color:#00ff7a; text-decoration:underline;">What is mURL?</a>
          </div>
          <button class="danger" id="reset-age" style="margin-top:6px;">Reset age confirmation</button>
        </div>
        <div class="row">
          <div class="help">with <span class="brand">mURL</span> by mosadd, v0.14.0</div>
        </div>
      </div>
    </div>
    <div id="trending-overlay">
      <div id="trending-pane">
        <h2>
          <span>🔥 Trending rooms</span>
          <button id="trending-close" aria-label="close">x</button>
        </h2>
        <div id="trending-status">loading…</div>
        <div id="trending-list"></div>
      </div>
    </div>
    <script type="module" src="./sidepanel.ts"></script>
  </body>
</html>
