# mosadd edge — Cloudflare Worker + Durable Object per channel
# Target architecture from plan file "SCALE ARCHITECTURE" + LINEAR-2675.
# Each mIRC/mROOM channel = one DO instance globally, holding WS connections +
# recent message ring. Auto-scales literally per channel; no central DB on hot path.
name = "mosadd-edge"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Hibernatable WebSockets: idle WS connections don't bill. Cheap at rest.
# See: developers.cloudflare.com/durable-objects/best-practices/websockets/
[[migrations]]
tag = "v1"
new_classes = ["ChannelDO"]

[durable_objects]
bindings = [
  { name = "CHANNEL", class_name = "ChannelDO" },
]

# Observability — Workers Logs (Tail) for free.
[observability]
enabled = true
head_sampling_rate = 1.0
