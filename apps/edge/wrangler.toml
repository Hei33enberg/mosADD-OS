# mosadd edge — Cloudflare Worker + Durable Object per channel
# Target architecture from plan file "SCALE ARCHITECTURE" + LINEAR-2675.
# Each mIRC channel = one DO instance globally, holding WS connections +
# recent message ring. Auto-scales literally per channel; no central DB on hot path.
name = "mosadd-edge"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Hibernatable WebSockets: idle WS connections don't bill. Cheap at rest.
# See: developers.cloudflare.com/durable-objects/best-practices/websockets/
[[migrations]]
tag = "v1"
new_classes = ["ChannelDO"]

[durable_objects]
bindings = [
  { name = "CHANNEL", class_name = "ChannelDO" },
]

# Supabase project URL — public, not a secret. The Worker calls
# /functions/v1/hub-key-verify on cache miss to validate hub keys.
[vars]
SUPABASE_URL = "https://rooffhgbxafyjcwmwpsy.supabase.co"

# Observability — Workers Logs (Tail) for free.
[observability]
enabled = true
head_sampling_rate = 1.0

# External dead-man's-switch: an INDEPENDENT scheduler (this Worker, not pg_cron)
# pings the Supabase `cron-watchdog` EF every 30 min. Survives total pg_cron
# death — the failure that caused 13 days of silent monitoring blindness on
# 2026-06-04, which an in-band watchdog cannot detect (it dies with the scheduler).
# Handler: scheduled() in src/index.ts. Self-gating on CRON_SHARED_SECRET.
[triggers]
crons = ["*/30 * * * *"]
