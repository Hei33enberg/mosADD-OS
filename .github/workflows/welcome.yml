name: welcome

# Greets first-time contributors. Message-only — this job NEVER checks out or
# executes PR code (pull_request_target runs with repo-token privileges).

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, closed]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor != 'dependabot[bot]' && !endsWith(github.actor, '[bot]')
    steps:
      - name: First-interaction greeting / first-merge level-up
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const author = context.payload.sender.login;

            // helper: count author's previous items of a type
            async function countPrev(type) {
              const q = `repo:${owner}/${repo} author:${author} type:${type}`;
              const { data } = await github.rest.search.issuesAndPullRequests({ q, per_page: 1 });
              return data.total_count;
            }

            const links = [
              `- [CONTRIBUTING.md](https://github.com/${owner}/${repo}/blob/main/CONTRIBUTING.md) — dev setup + PR rules`,
              `- [good first issues](https://github.com/${owner}/${repo}/issues?q=is%3Aissue+is%3Aopen+label%3A%22good+first+issue%22) — spec-grade, agent-executable`,
              `- [REALM.md](https://github.com/${owner}/${repo}/blob/main/REALM.md) — the contributor ladder (yes, there are titles)`,
              `- [AGENTS.md](https://github.com/${owner}/${repo}/blob/main/AGENTS.md) — contributing as/with an AI agent; your agent can post status to our coordination channel while it works`,
              `- Community: [GitHub Discussions](https://github.com/${owner}/${repo}/discussions) + the mosADD community room (runs on mosADD itself — [mosadd.com](https://mosadd.com))`,
            ].join('\n');

            if (context.eventName === 'issues') {
              if (await countPrev('issue') <= 1) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: context.payload.issue.number,
                  body: `Welcome to the Realm, @${author} 👋 — thanks for the first issue!\n\n${links}`,
                });
              }
            } else if (context.payload.action === 'opened') {
              if (await countPrev('pr') <= 1) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: context.payload.pull_request.number,
                  body: `Welcome to the Realm, @${author} 👋 — thanks for the first PR!\n\n${links}\n\nCI gives deterministic feedback (skill-lint included); fix forward if it goes red.`,
                });
              }
            } else if (context.payload.action === 'closed' && context.payload.pull_request.merged) {
              const q = `repo:${owner}/${repo} author:${author} type:pr is:merged`;
              const { data } = await github.rest.search.issuesAndPullRequests({ q, per_page: 1 });
              if (data.total_count === 1) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: context.payload.pull_request.number,
                  body: `🏰 First merged PR — you are now **L1 Squire** in the [Realm](https://github.com/${owner}/${repo}/blob/main/REALM.md), @${author}. The ledger updates automatically.`,
                });
              }
            }
