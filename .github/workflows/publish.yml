name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (alpha, beta, latest)'
        required: true
        default: 'alpha'
      access:
        description: 'access (public, restricted)'
        required: true
        default: 'public'
      move_latest:
        description: 'also point npm "latest" at the current version (so a bare `npm i @mosadd/mcp` gets the current build, not the oldest)'
        required: false
        default: 'false'

jobs:
  publish:
    name: publish @mosadd/* to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write  # for npm provenance

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Smoke test
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}
          {"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 10 node packages/mcp/dist/bin/mcp.js > /dev/null
          echo "✓ MCP server starts and lists tools"

      - name: Publish (in dependency order)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || 'alpha' }}"
          ACCESS="${{ github.event.inputs.access || 'public' }}"
          for pkg in protocol crypto providers core threat-engine bridges mcp ai; do
            echo "::group::publish @mosadd/$pkg"
            # NOTE: no --provenance. npm rejects provenance for PRIVATE source
            # repos (422 "Unsupported GitHub Actions source repository
            # visibility: private"). mosadd-os is private while the @mosadd/*
            # packages publish public — re-add --provenance only if/when the
            # repo is made public.
            if ! pnpm publish "packages/$pkg" \
              --access "$ACCESS" \
              --tag "$TAG" \
              --no-git-checks 2> /tmp/pub.err; then
              cat /tmp/pub.err
              if grep -qi "cannot publish over the previously published" /tmp/pub.err; then
                echo "↷ @mosadd/$pkg already at this version — skipping (not a failure)"
              else
                echo "::error::publish @mosadd/$pkg failed"
                exit 1
              fi
            fi
            echo "::endgroup::"
          done

      - name: Smoke install
        run: |
          # Verify the published package actually works
          TAG="${{ github.event.inputs.tag || 'alpha' }}"
          mkdir /tmp/smoke && cd /tmp/smoke
          npm init -y > /dev/null
          npm install "@mosadd/mcp@$TAG"
          ls node_modules/@mosadd/mcp/dist/bin/mcp.js
          echo "✓ @mosadd/mcp@$TAG installs and has the bin"

      - name: Move 'latest' dist-tag (optional)
        if: ${{ github.event.inputs.move_latest == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Point `latest` at the version in each package.json so a bare
          # `npm install @mosadd/<pkg>` resolves to the current build instead of
          # the very first alpha.0 publish.
          for pkg in protocol crypto providers core threat-engine bridges mcp ai; do
            V=$(node -p "require('./packages/$pkg/package.json').version")
            echo "→ @mosadd/$pkg@$V → latest"
            if ! npm dist-tag add "@mosadd/$pkg@$V" latest 2> /tmp/dt.err; then
              cat /tmp/dt.err
              echo "↷ skip @mosadd/$pkg (not published at $V?)"
            fi
          done
          echo "✓ latest dist-tags moved"
