name: link-check

# Weekly markdown link rot check + PR check for links a PR introduces.
# Cron findings land in ONE rolling issue ("Link rot report") — never spam.

on:
  pull_request:
    branches: [main]
    paths: ["**/*.md"]
  schedule:
    - cron: "29 6 * * 1" # Monday 06:29 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --include-fragments
            --exclude 'localhost' --exclude '127\.0\.0\.1'
            --exclude 'linear\.app'
            --exclude 'twitter\.com|x\.com'
            --exclude 'mosadd\.com/m/'
            --exclude-path node_modules --exclude-path apps --exclude-path packages --exclude-path examples
            --max-retries 3
            './**/*.md'
          fail: ${{ github.event_name == 'pull_request' }}
          jobSummary: true

      - name: Update rolling "Link rot report" issue (cron only)
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('lychee/out.md') ? fs.readFileSync('lychee/out.md', 'utf8').slice(0, 60000) : 'See workflow run for details.';
            const title = 'Link rot report';
            const body = `Automated weekly link check found broken links.\n\n${report}\n\n_Advisory — fix at leisure; PR-introduced broken links are blocked separately._`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'link-rot',
            });
            if (issues.length) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issues[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['link-rot'] });
            }
