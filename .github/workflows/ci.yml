name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck · build · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Opt into Node.js 24 for action runtimes (GitHub deprecating Node 20 in Sep 2026)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Lockfile drift check (fails fast if package.json ↔ pnpm-lock.yaml desynced)
        run: |
          # Mirrors the frozen install but flagged clearly. Catches the class of bug
          # where a merged PR rewrites the lockfile without preserving root `pnpm.overrides`.
          set +e
          pnpm install --frozen-lockfile --dry-run 2>&1 | tee /tmp/lockcheck.log
          if grep -q "ERR_PNPM_LOCKFILE" /tmp/lockcheck.log; then
            echo "::error::Lockfile is out of sync with package.json. Run \`pnpm install --lockfile-only\` locally and commit pnpm-lock.yaml."
            exit 1
          fi
          set -e

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first so workspace packages emit their dist/*.d.ts —
      # @mosadd/ai's typecheck needs @mosadd/mcp's type declarations to exist.
      - name: Build (all packages)
        run: pnpm -r build

      - name: Typecheck (all packages — uses freshly built dist)
        run: pnpm -r typecheck

      - name: Smoke test — @mosadd/mcp speaks MCP
        run: |
          # Initialize handshake + list tools, fail if we don't see the expected channels.
          OUTPUT=$(echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}
          {"jsonrpc":"2.0","id":2,"method":"tools/list"}' | timeout 10 node packages/mcp/dist/bin/mcp.js)
          echo "$OUTPUT"
          for tool in mDM_send mDM_list_contacts mIRC_create mROOM_create_guest_link mAIL_send; do
            if ! echo "$OUTPUT" | grep -q "\"name\":\"$tool\""; then
              echo "::error::Expected tool $tool missing from tools/list"
              exit 1
            fi
          done
          echo "✓ All expected tools present in MCP smoke test"

      - name: Test (vitest across packages that have a test script)
        run: pnpm -r test --if-present

      - name: Lint (any packages that have it)
        run: pnpm -r lint --if-present
        continue-on-error: true

      - name: Publish dry-run (verify packages can be packed)
        run: |
          for pkg in protocol crypto threat-engine mcp; do
            echo "--- npm pack --dry-run @mosadd/$pkg ---"
            cd packages/$pkg
            npm pack --dry-run 2>&1 | tail -5
            cd ../..
          done

  # Standalone Next.js apps live outside the pnpm workspace (own package-lock, npm),
  # so the package job above never builds them. Build them here so a TS error or a
  # broken import in the public site/hub can't merge undetected. (murl-www and
  # channel0-ext are a separate agent's lane and deploy independently.)
  apps:
    name: apps · typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [dev, hub]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install (apps/${{ matrix.app }})
        working-directory: apps/${{ matrix.app }}
        run: npm ci || npm install
      - name: Typecheck (apps/${{ matrix.app }})
        working-directory: apps/${{ matrix.app }}
        run: npm run typecheck --if-present
      - name: Build (apps/${{ matrix.app }})
        working-directory: apps/${{ matrix.app }}
        run: npm run build
