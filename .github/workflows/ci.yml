name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck · build · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Opt into Node.js 24 for action runtimes (GitHub deprecating Node 20 in Sep 2026)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Lockfile drift check (fails fast if package.json ↔ pnpm-lock.yaml desynced)
        run: |
          # Catches the class of bug where a merged PR rewrites the lockfile without
          # preserving root `pnpm.overrides`. Re-resolve the lockfile from the
          # package.json manifests and fail if it would change. (The previous
          # implementation used `--dry-run`, which pnpm does not support — it errored
          # before checking anything, so the gate never actually fired.)
          pnpm install --lockfile-only
          if ! git diff --exit-code --quiet pnpm-lock.yaml; then
            echo "::error::Lockfile is out of sync with package.json. Run \`pnpm install --lockfile-only\` locally and commit pnpm-lock.yaml."
            git --no-pager diff --stat pnpm-lock.yaml
            git checkout -- pnpm-lock.yaml
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first so workspace packages emit their dist/*.d.ts —
      # @mosadd/ai's typecheck needs @mosadd/mcp's type declarations to exist.
      - name: Build (all packages)
        run: pnpm -r build

      - name: Typecheck (all packages — uses freshly built dist)
        run: pnpm -r typecheck

      - name: Smoke test — @mosadd/mcp speaks MCP
        run: |
          # Initialize handshake + list tools, fail if we don't see the expected channels.
          OUTPUT=$(echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}
          {"jsonrpc":"2.0","id":2,"method":"tools/list"}' | timeout 10 node packages/mcp/dist/bin/mcp.js)
          echo "$OUTPUT"
          for tool in mDM_send mDM_list_contacts mIRC_create mIRC_post_message mAYL_send; do
            if ! echo "$OUTPUT" | grep -q "\"name\":\"$tool\""; then
              echo "::error::Expected tool $tool missing from tools/list"
              exit 1
            fi
          done
          echo "✓ All expected tools present in MCP smoke test"

      - name: Test (vitest across packages that have a test script)
        run: pnpm -r test --if-present

      - name: Lint (any packages that have it)
        run: pnpm -r lint --if-present
        continue-on-error: true

      - name: Publish dry-run (verify packages can be packed)
        run: |
          for pkg in protocol crypto threat-engine mcp; do
            echo "--- npm pack --dry-run @mosadd/$pkg ---"
            cd packages/$pkg
            npm pack --dry-run 2>&1 | tail -5
            cd ../..
          done

  # Standalone apps live outside the pnpm workspace (own package-lock, npm), so the
  # package job above never builds them. Build them here so a TS error, a broken
  # import, or a stale lockfile in the public site/hub/gateway can't merge undetected
  # (mcp-http = the mcp.mosadd.com gateway; a stale lock there silently kept an old
  # deploy live). murl-www, embed, and channel0-ext are separate lanes / parked and
  # deploy independently.
  apps:
    name: apps · typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [dev, hub, mcp-http]
    steps:
      - uses: actions/checkout@v5
      # The root package.json declares packageManager=pnpm, so setup-node looks for
      # pnpm on PATH even though these apps build with npm. Provide it.
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          # Cache npm (what these apps actually install with), keyed on the app's own
          # lockfile. Without an explicit cache target, setup-node auto-detects the
          # root packageManager=pnpm and its post-step tries to save a pnpm store that
          # was never populated (apps use npm) -> "Path Validation Error" fails the job.
          cache: 'npm'
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install (apps/${{ matrix.app }})
        working-directory: apps/${{ matrix.app }}
        run: npm ci || npm install
      - name: Typecheck (apps/${{ matrix.app }})
        working-directory: apps/${{ matrix.app }}
        run: npm run typecheck --if-present
      - name: Build (apps/${{ matrix.app }})
        working-directory: apps/${{ matrix.app }}
        run: npm run build
