name: deploy-edge

# Deploys the mosadd-edge Worker + ChannelDO to Cloudflare (LINEAR-2675/2677).
# Triggered on pushes that touch apps/edge, and manually.
# Uses CLOUDFLARE_API_TOKEN (repo secret) — never committed.

on:
  push:
    branches: [main]
    paths:
      - "apps/edge/**"
      - ".github/workflows/deploy-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/edge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/edge/package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: apps/edge
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
