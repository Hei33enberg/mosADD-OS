name: deploy-edge

# Deploys the mosadd-edge Worker + ChannelDO to Cloudflare (LINEAR-2675/2677).
# Triggered on pushes that touch apps/edge, and manually.
# Uses CLOUDFLARE_API_TOKEN (repo secret) — never committed.

on:
  push:
    branches: [main]
    paths:
      - "apps/edge/**"
      - ".github/workflows/deploy-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/edge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Wrangler v4 requires Node 22+. Bumped from 20 when the `npx wrangler@latest
          # secret put` steps started failing (LINEAR-2675/E6 deploy run #26861783449).
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/edge/package.json

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Push the ingest shared-secret to Cloudflare BEFORE deploying so the
      # new Worker version starts with it bound. Same value lives as a
      # Supabase Edge Function secret (CF_INGEST_SECRET).
      # Skipped automatically (echo no-op) if the GH secret isn't set yet,
      # so this workflow stays green for any contributor.
      - name: Push CF_INGEST_SECRET to Worker (if set)
        env:
          CF_INGEST_SECRET: ${{ secrets.CF_INGEST_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_INGEST_SECRET" ]; then
            echo "::notice::CF_INGEST_SECRET not set in repo secrets; skipping (E3 flush will be disabled until set)"
            exit 0
          fi
          npx wrangler@latest secret put CF_INGEST_SECRET <<< "$CF_INGEST_SECRET"

      # E6 (LINEAR-2675): HS256 secret used to verify per-channel scoped JWTs
      # minted by Supabase `hub-mint-channel-token`. Same value lives in
      # Supabase Edge Function secrets so mint + verify share a key.
      - name: Push CHANNEL_TOKEN_SECRET to Worker (if set)
        env:
          CHANNEL_TOKEN_SECRET: ${{ secrets.CHANNEL_TOKEN_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CHANNEL_TOKEN_SECRET" ]; then
            echo "::notice::CHANNEL_TOKEN_SECRET not set in repo secrets; skipping (E6 scoped-token auth disabled — clients must use ?k= / Authorization)"
            exit 0
          fi
          npx wrangler@latest secret put CHANNEL_TOKEN_SECRET <<< "$CHANNEL_TOKEN_SECRET"

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: apps/edge
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
