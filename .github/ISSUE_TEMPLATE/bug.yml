name: Bug report
description: Report a bug in mosadd
labels: [bug, triage]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Steps to reproduce. Minimal reproducible example preferred.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mosadd version
      description: 'Output of: pnpm list @m0ssad/mcp'
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: 'Output of: node --version'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
