.phone{width:375px;background:var(--mosadd-background);font-family:var(--font-mosadd-mono)}
.bar{display:flex;align-items:center;gap:8px;padding:4px 12px;background:var(--mosadd-background)}
.dd{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px;border:1px solid var(--mosadd-border);background:hsl(0 0% 15% / .8);box-shadow:var(--mosadd-dropdown-shadow)}

.chev{width:12px;height:12px;color:var(--mosadd-muted-foreground)}
.se{flex:1;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;min-width:112px}
.se span{flex:1;font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--mosadd-muted-foreground);white-space:nowrap}
.sg{display:grid;place-items:center;width:36px;height:36px}
.r2{display:flex;align-items:center;gap:22px;padding:6px 16px 10px;font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--mosadd-muted-foreground)}
.r2 .on{color:var(--mosadd-primary)}
