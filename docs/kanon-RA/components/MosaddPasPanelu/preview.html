<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>MosaddPasPanelu</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:16px;background:#1a1a1a}
.phone{width:375px;background:var(--mosadd-background);font-family:var(--font-mosadd-mono)}
.edge{height:2px;background:var(--mosadd-primary)}
.band{height:56px;display:flex;align-items:center;padding:0 16px}
.band b{font-size:13px;font-weight:700;letter-spacing:.3em;color:var(--mosadd-primary)}
.sec{display:flex;align-items:center;gap:10px;padding:0 16px;font-size:10px;letter-spacing:.2em;color:var(--mosadd-muted-foreground)}
.sec i{flex:1;height:1px;background:var(--mosadd-border)}
.card{margin:12px 16px 16px;display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--mosadd-border)}
.card span{flex:1;font-size:14px;font-weight:600;color:var(--mosadd-foreground)}
.card a{display:grid;place-items:center;height:44px;padding:0 14px;border:1px solid var(--mosadd-primary);color:var(--mosadd-primary);font-size:10px;font-weight:700;letter-spacing:.18em;text-decoration:none}
</style></head>
<body>
<div class="phone">
 <div class="edge"></div>
 <div class="band"><b>mOPS</b></div>
 <div class="sec">1 · USB<i></i></div>
 <div class="card"><span>Gmail</span><a href="#">CONNECT</a></div>
</div>
</body>
</html>
