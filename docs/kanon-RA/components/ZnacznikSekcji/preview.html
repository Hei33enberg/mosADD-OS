<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>ZnacznikSekcji</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:18px 20px;display:grid;gap:22px}
.row{display:flex;align-items:center;gap:12px}
.mo{background:var(--mosadd-lp-background);font-family:var(--font-mosadd-mono);padding:14px 16px}
.mo .n{font-size:11px;letter-spacing:.18em;color:var(--mosadd-primary);font-weight:600}
.mo .t{font-size:11px;letter-spacing:.3em;color:var(--mosadd-lp-muted-foreground);text-transform:uppercase}
.mo .rail{flex:1;height:1px;background:repeating-linear-gradient(90deg,hsl(0 0% 23%) 0 3px,transparent 3px 9px)}
.en{background:var(--eng-background);padding:14px 16px}
.en .n{font-family:var(--font-eng-dot);font-size:13px;color:var(--eng-signal);letter-spacing:.06em}
.en .t{font-family:var(--font-eng-mono);font-size:11px;letter-spacing:.2em;color:var(--eng-text-dim);text-transform:uppercase}
.en .rail{flex:1;height:1px;background:var(--eng-line)}
</style></head>
<body>
<div class="row mo"><span class="n">//06</span><span class="t">The memory</span><span class="rail"></span></div>
<div class="row en"><span class="n">//00</span><span class="t">What he is</span><span class="rail"></span></div>
</body>
</html>
