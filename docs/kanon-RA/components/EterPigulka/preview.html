<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>EterPigulka</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:22px 20px;background:var(--eter-background)}
.cta{display:grid;place-items:center;width:320px;height:54px;border-radius:9999px;background:linear-gradient(135deg,#7c3aed,#a84cb8);
  font-family:var(--font-eter-mono);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:var(--eter-foreground);
  text-decoration:none;box-shadow:0 10px 28px -9px hsl(288 55% 56% / .8)}
.hint{margin:8px 0 0;width:320px;text-align:center;font-family:var(--font-eter-mono);font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:hsl(0 0% 100% / .4)}
</style></head>
<body>
<a class="cta" href="/auth?mode=register">Start free</a>
<p class="hint">No card · no account to begin</p>
</body>
</html>
